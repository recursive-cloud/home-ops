---
version: "3.9"

services:
  pocket-id:
    container_name: pocket-id-mgmt
    # Use distroless image
    image: ghcr.io/pocket-id/pocket-id:v2.14.0-distroless@sha256:e0f83a42a78d0759b6d2d8c7380ef0fa8a4c95dfa01ad88740a073ae9cc4ba94
    restart: unless-stopped
    networks:
      mgmt-bridge:
    volumes:
      - "$BUILTIN__APP_DATA_HOST_PATH/pocket-id-mgmt:/app/data:rw"
    # Read only filesystem inside the container
    read_only: true
    # Run as non-root user
    user: "1002:3004"
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
    environment:
      - APP_URL=https://auth.mgmt.$BUILTIN__BASE_DOMAIN
      - ENCRYPTION_KEY=$GEN_BASE64_32__ENCRYPTION_KEY
      - TRUST_PROXY=true
      - MAXMIND_LICENSE_KEY=$SECRET__MAXMIND_LICENSE_KEY
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mgmt-bridge"
      - "traefik.http.routers.pocket-id-mgmt.rule=Host(`auth.mgmt.$BUILTIN__BASE_DOMAIN`)"
      - "traefik.http.services.pocket-id-mgmt.loadbalancer.server.port=1411"
networks:
  mgmt-bridge:
    external: true
